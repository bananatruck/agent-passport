name: Partner drift check

# Re-inspects partners pinned in apps/site/public/passports.json against their live files,
# so the site's publisher hears about a change before a visitor does.
#
# Scheduled runs check only the partners that must stay verified (Harbor Ferry). The demo's
# Tidewhistle Rooms partner changed after review on purpose, so including it would fail every
# day; a manual run checks every pin and is expected to fail on that partner.

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter agent-passport build
      - name: Check the partners that must stay verified
        if: github.event_name == 'schedule'
        run: >-
          node packages/passport/bin/agent-passport.mjs check
          --file apps/site/public/passports.json
          --network https://raw.githubusercontent.com/bananatruck/agent-passport/main/peers/harbor_ferry/harbor_ferry
      - name: Check every pinned partner
        if: github.event_name != 'schedule'
        run: node packages/passport/bin/agent-passport.mjs check --file apps/site/public/passports.json
